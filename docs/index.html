&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function head(tag,title,sub){return '<div class="eyebrow">'+tag+'</div><h1>'+title+'</h1><p class="muted">'+sub+'</p>'}function card(m,n,k){return '<div class="card"><small>'+n+'층 · '+k+'</small><h3>'+esc(m.name)+'</h3><p>'+esc(m.description)+'</p></div>'}function draw(){document.querySelectorAll('aside button').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick')==="go('"+view+"')"));if(view==='home')app.innerHTML=head('ROYAL ARCHIVE','에르바니아 도감','왕국과 대던전의 기록. 확정된 세계관 자료를 열람하는 도감입니다.')+'<div class="grid"><div class="card"><h3>대던전 12층</h3><p>국가 규모의 다양한 자연환경</p><button onclick="go(\'floors\')">열람 →</button></div><div class="card"><h3>몬스터 180개 출현 목록</h3><p>일반 96 · 엘리트 48 · 네임드 36</p><button onclick="go(\'monsters\')">열람 →</button></div></div>';else if(view==='floors')app.innerHTML=head('DUNGEON ATLAS','대던전 12층','층마다 서로 다른 현실 기반 생태계가 펼쳐집니다.')+'<div class="grid">'+floors.map((f,i)=>'<div class="card"><h3>'+f.n+'층</h3><p>'+esc(f.terrain.replaceAll('\\n',' / ').slice(0,125))+'</p><button onclick="openFloor('+i+')">상세 보기 →</button></div>').join('')+'</div>';else if(view==='floor'){let f=floors[chosen];app.innerHTML='<button class="back" onclick="go(\'floors\')">← 12개 층</button>'+head('DUNGEON ATLAS',f.n+'층','지형과 서식 몬스터')+'<div class="panel"><h2>지형 정보</h2><p>'+esc(f.terrain.replaceAll('\\n','\n'))+'</p></div>'+Object.entries(labels).map(([k,label])=>'<h2>'+label+' <span class="count">'+f.mobs[k].length+'</span></h2><div class="grid">'+f.mobs[k].map(m=>card(m,f.n,label)).join('')+'</div>').join('')}else if(view==='monsters'){app.innerHTML=head('BESTIARY','몬스터 도감','고유 명칭과 직관적 묘사명으로 검색할 수 있습니다.')+'<div class="toolbar"><input id="q" placeholder="몬스터 검색" oninput="search=this.value;results()"><div>'+[['all','전체'],...Object.entries(labels)].map(([k,l])=>'<button class="pill '+(kind===k?'on':'')+'" onclick="kind=\''+k+'\';draw()">'+l+'</button>').join('')+'</div></div><p class="muted" id="count"></p><div class="grid" id="results"></div>';document.getElementById('q').value=search;results()}else if(view==='lore')app.innerHTML=head('WORLD LORE','세계관 기록','에르바니아 왕국의 기초 설정')+'<div class="panel"><h2>왕국력</h2><p>왕국 건국을 원년으로 삼습니다. 신규 TRPG의 공통 시작일은 왕국력 876년 4월 3일이며, 캠페인마다 날짜가 독립적으로 진행됩니다.</p></div>';else app.innerHTML=head('ARCHIVE',{essences:'정수 도감',equipment:'장비 · 아이템',people:'인물 도감'}[view],'준비 중')+'<div class="panel"><p>추후 확정된 데이터가 등록되면 이곳에 표시됩니다.</p></div>'}function results(){let all=floors.flatMap(f=>Object.entries(labels).flatMap(([k,l])=>f.mobs[k].map(m=>({...m,n:f.n,k,l}))));let shown=all.filter(m=>(kind==='all'||kind===m.k)&&(m.name+' '+m.description+' '+m.n).toLowerCase().includes(search.toLowerCase()));document.getElementById('count').textContent=shown.length+'개 출현 목록';document.getElementById('results').innerHTML=shown.map(m=>card(m,m.n,m.l)).join('')||'<p>검색 결과가 없습니다.</p>'}function go(v){view=v;search='';draw();scrollTo(0,0)}function openFloor(i){chosen=i;view='floor';draw();scrollTo(0,0)}draw();</script></html>
