<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>대미궁 아비스 · 웹 프로토타입</title>
<style>
:root{color-scheme:dark;--bg:#090f19;--panel:#131f2e;--line:#304259;--gold:#d7b775;--text:#e7edf4;--muted:#96a8ba}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b2b3d,#090f19 72%);color:var(--text);font:14px/1.5 system-ui,"Apple SD Gothic Neo",sans-serif}button{font:inherit;cursor:pointer;background:#203248;color:var(--text);border:1px solid #435773;border-radius:9px;padding:9px 12px}button:hover{background:#304760}button:disabled{opacity:.35;cursor:not-allowed}.gold{color:var(--gold)}.muted{color:var(--muted)}header{max-width:1400px;margin:auto;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-family:Georgia,serif;font-size:26px;letter-spacing:2px;margin:0;color:var(--gold)}h2{font-size:15px;margin:0 0 13px;color:var(--gold)}.sub{font-size:11px;letter-spacing:2px;color:#879db3}.layout{max-width:1400px;margin:auto;padding:0 20px 20px;display:grid;grid-template-columns:245px minmax(350px,1fr) 270px;gap:14px}.panel{background:linear-gradient(155deg,#172538,#111c2b);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 10px 28px #0003}.line{height:1px;background:#344456;margin:14px 0}.between{display:flex;justify-content:space-between;align-items:center;gap:8px}.meter{height:8px;border-radius:8px;background:#07101b;overflow:hidden;margin:4px 0 12px}.meter span{display:block;height:100%;background:#b45e64}.meter.mp span{background:#5b92c5}.meter.xp span{background:#d4b571}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.stat{border:1px solid #34475b;border-radius:8px;padding:8px;background:#101c2a}.stat strong{float:right;color:#f1dfb2}.maphead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.maphead h2{margin:0}.mapbox{position:relative;background:#080e15;border:1px solid #304052;border-radius:9px;overflow:hidden;aspect-ratio:17/13;max-height:68vh}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.mapfoot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:10px;color:var(--muted);font-size:12px}.log{height:490px;overflow:auto;font-size:12px}.entry{padding:9px 0;border-bottom:1px solid #293a4b}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.actions button{flex:1;min-width:95px}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.modalback{position:fixed;inset:0;background:#02070bd9;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modalback.open{display:flex}.modal{width:min(470px,100%);max-height:90vh;overflow:auto;background:#172639;border:1px solid #62718a;border-radius:16px;padding:22px;box-shadow:0 25px 80px #000a}.modal h2{font-size:20px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choices button{text-align:left;min-height:68px}.battleinfo{margin:14px 0;padding:14px;background:#0c1724;border-radius:10px}.footer{max-width:1400px;margin:0 auto 18px;padding:0 20px;color:#8498aa;font-size:12px;text-align:center}kbd{border:1px solid #526176;border-radius:4px;padding:1px 5px;background:#26364a}@media(max-width:1050px){.layout{grid-template-columns:220px 1fr}.right{grid-column:1/-1}.log{height:170px}}@media(max-width:680px){header{padding:14px;flex-direction:column;align-items:flex-start}.layout{display:flex;flex-direction:column;padding:0 10px 10px}.panel{padding:12px}.mapbox{max-height:none}.footer{padding:12px}.choices{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div><div class="sub">THE GREAT LABYRINTH</div><h1>대미궁 아비스</h1></div><div class="toolbar"><button id="save">저장</button><button id="load">불러오기</button><button id="newrun">새 탐사 회차</button></div></header>
<main class="layout"><aside class="panel"><h2>탐사자 · 아이젠 하이르</h2><div class="between"><strong id="level"></strong><span class="muted" id="day"></span></div><div class="line"></div><div class="between"><span>HP</span><span id="hptext"></span></div><div class="meter"><span id="hpbar"></span></div><div class="between"><span>MP</span><span id="mptext"></span></div><div class="meter mp"><span id="mpbar"></span></div><div class="between"><span>EXP</span><span id="xptext"></span></div><div class="meter xp"><span id="xpbar"></span></div><h2>능력치</h2><div class="stats" id="stats"></div><div class="actions"><button id="allocate">능력치 투자 [N]</button></div><div class="line"></div><div class="between"><span>보유 골드</span><strong class="gold" id="gold"></strong></div><div class="between"><span>정수</span><strong id="essence">없음</strong></div></aside>
<section class="panel"><div class="maphead"><div><div class="sub">FLOOR 01 · EXPLORATION</div><h2 id="region"></h2></div><button id="regions">지역 선택 [M]</button></div><div class="mapbox"><canvas id="map" width="680" height="520" aria-label="탐사 지도"></canvas></div><div class="mapfoot"><span>◆ 탐사자　● 몬스터　◇ 보물</span><span id="progress"></span></div><div class="actions"><button id="interact">상호작용 [E]</button><button id="camp">야영 [C]</button><button id="respawn">재출현 [R]</button></div><p class="muted" style="font-size:12px;margin-bottom:0">이동: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 방향키 · 지역: <kbd>M</kbd> · 몬스터는 이동하지 않음</p></section>
<aside class="panel right"><h2>탐사 기록</h2><div class="between"><span class="muted">이번 탐사</span><span class="gold" id="run"></span></div><div class="line"></div><div class="log" id="log" aria-live="polite"></div></aside></main><div class="footer">웹 프로토타입 · Godot 원본은 별도로 보존됩니다 · 자동 저장 지원</div>
<div class="modalback" id="back"><div class="modal"><div class="between"><h2 id="modaltitle"></h2><button id="close">닫기 ✕</button></div><div id="modalbody"></div></div></div>
<script>
"use strict";
const W=50,H=40,VW=17,VH=13,T=40,regions=["초원 지대","이끼 숲","폐허 지대","지하 습지"],types=["slime","wolf","rat","beetle"],names={slime:"슬라임",wolf:"늑대",rat:"이끼쥐",beetle:"딱정벌레"},enemyStats={slime:[32,7,12],wolf:[42,12,16],rat:[26,9,11],beetle:[55,8,17]},start={x:3,y:H-4},KEY="abyss-web-prototype-v1";
const $=id=>document.getElementById(id),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,hash=(x,y,seed)=>{let n=(x*374761393+y*668265263+seed*1442695041)|0;n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967295},id=(x,y)=>x+","+y;
let game,battle=null;
function initial(){return {run:1,region:0,player:{...start},level:1,exp:0,gold:0,hp:100,mp:45,points:0,stats:{STR:20,AGI:5,HP:5,MP:5,WIL:5,MAG:5,LUK:20},activity:0,day:1,maps:{},events:[]}}
function maxhp(){return 75+game.stats.HP*5}function maxmp(){return 30+game.stats.MP*3}function needxp(){return 100+(game.level-1)*140}
function log(msg){game.events.unshift(msg);game.events=game.events.slice(0,120);renderLog()}
function renderLog(){$("log").innerHTML="";game.events.forEach((s,i)=>{let d=document.createElement("div");d.className="entry";d.textContent=s;$("log").append(d)})}
function tileMap(region,seed){let tiles=new Uint8Array(W*H);const index=(x,y)=>y*W+x;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let wall=x===0||y===0||x===W-1||y===H-1;const v=hash(x,y,region+91),fixed=hash(Math.floor(x/5),Math.floor(y/5),region+10);if(region===0)wall ||= fixed>.82&&v>.42;else if(region===1)wall ||= fixed>.58&&v>.32;else if(region===2)wall ||= ((x%9===0&&y%8!==3)||(y%10===0&&x%7!==4))&&x>7&&y>5||fixed>.83&&v>.43;else wall ||=fixed>.68&&v>.35;tiles[index(x,y)]=wall?1:0}
for(let y=H-8;y<H-1;y++)for(let x=1;x<9;x++)tiles[index(x,y)]=0;
const seen=new Set([id(start.x,start.y)]),queue=[{...start}];for(let k=0;k<queue.length;k++){const p=queue[k];for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const x=p.x+dx,y=p.y+dy,key=id(x,y);if(x>0&&y>0&&x<W-1&&y<H-1&&!tiles[index(x,y)]&&!seen.has(key)){seen.add(key);queue.push({x,y})}}}
let eligible=queue.filter(p=>Math.abs(p.x-start.x)+Math.abs(p.y-start.y)>7);for(let i=eligible.length-1;i>0;i--){let j=rand(0,i);[eligible[i],eligible[j]]=[eligible[j],eligible[i]]}
let monsters={},chests={};eligible.slice(0,27).forEach((p,i)=>monsters[id(p.x,p.y)]=types[(i+region)%4]);eligible.slice(27,36).forEach(p=>chests[id(p.x,p.y)]=true);
return {tiles:Array.from(tiles),monsters,chests,explored:{},seed}}
function current(){return game.maps[game.region]}function ensure(region){if(!game.maps[region])game.maps[region]=tileMap(region,game.run*100+region)}
function reveal(){const m=current();for(let y=Math.max(1,game.player.y-5);y<=Math.min(H-2,game.player.y+5);y++)for(let x=Math.max(1,game.player.x-5);x<=Math.min(W-2,game.player.x+5);x++){if(Math.hypot(x-game.player.x,y-game.player.y)<=5.5)m.explored[id(x,y)]=true}}
function visible(x,y){return Math.hypot(x-game.player.x,y-game.player.y)<=5.5}
function draw(){const c=$("map"),ctx=c.getContext("2d");ctx.fillStyle="#080e15";ctx.fillRect(0,0,c.width,c.height);const ox=Math.max(0,Math.min(W-VW,game.player.x-Math.floor(VW/2))),oy=Math.max(0,Math.min(H-VH,game.player.y-Math.floor(VH/2))),m=current(),pal=[["#355746","#52604f"],["#244d40","#3d5d50"],["#4c4a49","#66615a"],["#344b4b","#53635c"]][game.region];for(let sy=0;sy<VH;sy++)for(let sx=0;sx<VW;sx++){const x=ox+sx,y=oy+sy,k=id(x,y),vis=visible(x,y),seen=!!m.explored[k];ctx.fillStyle=!seen?"#080e15":m.tiles[y*W+x]?pal[1]:pal[0];ctx.fillRect(sx*T,sy*T,T-1,T-1);if(seen&&!vis){ctx.fillStyle="#080e15bb";ctx.fillRect(sx*T,sy*T,T-1,T-1)}if(vis){const cx=sx*T+T/2,cy=sy*T+T/2;if(m.chests[k]){ctx.fillStyle="#dfba70";ctx.fillRect(cx-7,cy-6,14,12);ctx.fillStyle="#674925";ctx.fillRect(cx-2,cy-6,4,12)}if(m.monsters[k]){const kind=m.monsters[k];ctx.fillStyle={slime:"#d87978",wolf:"#e37d75",rat:"#cb6a72",beetle:"#b95b63"}[kind];ctx.beginPath();if(kind==="rat"){ctx.moveTo(cx,cy-9);ctx.lineTo(cx+9,cy+7);ctx.lineTo(cx-9,cy+7);ctx.closePath();ctx.fill()}else if(kind==="beetle")ctx.fillRect(cx-10,cy-10,20,20);else{ctx.arc(cx,cy,kind==="wolf"?12:9,0,Math.PI*2);ctx.fill()}}}}
const px=(game.player.x-ox)*T+T/2,py=(game.player.y-oy)*T+T/2;ctx.fillStyle="#a4e4ff";ctx.beginPath();ctx.moveTo(px,py-13);ctx.lineTo(px+12,py);ctx.lineTo(px,py+13);ctx.lineTo(px-12,py);ctx.closePath();ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke()}
function refresh(){ensure(game.region);reveal();$("region").textContent="제1층 · "+regions[game.region];$("level").textContent="Lv. "+game.level;$("day").textContent="제"+game.day+"일";$("hptext").textContent=game.hp+" / "+maxhp();$("mptext").textContent=game.mp+" / "+maxmp();$("xptext").textContent=game.exp+" / "+needxp();$("hpbar").style.width=100*game.hp/maxhp()+"%";$("mpbar").style.width=100*game.mp/maxmp()+"%";$("xpbar").style.width=100*game.exp/needxp()+"%";$("gold").textContent=game.gold.toLocaleString()+" G";$("run").textContent=game.run+"회차";$("stats").innerHTML=Object.entries(game.stats).map(([k,v])=>'<div class="stat">'+k+' <strong>'+v+'</strong></div>').join("");$("allocate").textContent="능력치 투자 [N] · "+game.points+"P";const m=current(),reachable=m.tiles.filter(v=>!v).length,seen=Object.keys(m.explored).filter(k=>{let [x,y]=k.split(",").map(Number);return !m.tiles[y*W+x]}).length;$("progress").textContent="탐사율 "+Math.round(seen/reachable*100)+"%";draw();renderLog();save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(game))}catch(e){console.warn("저장 실패",e)}}
function load(){try{const g=JSON.parse(localStorage.getItem(KEY));if(!g||!g.stats||!g.maps)throw Error("저장 없음");game=g;game.hp=Math.min(game.hp,maxhp());game.mp=Math.min(game.mp,maxmp());battle=null;close();refresh();log("저장된 탐사 기록을 불러왔다.")}catch(e){if(!game){game=initial();ensure(0);log("새로운 탐사가 시작되었다.");refresh()}else log("불러올 저장 기록이 없다.")}}
function step(dx,dy){if(battle||$("back").classList.contains("open"))return;let x=game.player.x+dx,y=game.player.y+dy,m=current();if(x<0||y<0||x>=W||y>=H||m.tiles[y*W+x])return;game.player={x,y};game.activity++;reveal();const k=id(x,y);if(m.monsters[k])beginBattle(k,m.monsters[k]);else if(m.chests[k])log("근처에 보물상자가 있다. [E]로 열 수 있다.");if(game.activity>=10){game.activity=0;game.day++;game.hp=Math.min(maxhp(),game.hp+Math.round(maxhp()*.18));game.mp=Math.min(maxmp(),game.mp+Math.round(maxmp()*.25));respawn(false);log("하루가 지나 잠시 휴식을 취했다.")}refresh()}
function respawn(announce=true){let m=current(),keys=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){let k=id(x,y);if(!m.tiles[y*W+x]&&!m.monsters[k]&&!m.chests[k]&&Math.hypot(x-game.player.x,y-game.player.y)>7)keys.push(k)}let count=Math.min(3,Math.max(0,30-Object.keys(m.monsters).length),keys.length);for(let i=0;i<count;i++){let n=rand(0,keys.length-1),k=keys.splice(n,1)[0];m.monsters[k]=types[rand(0,3)]}if(announce)log(count?"몬스터 "+count+"마리가 다시 나타났다.":"현재 지역의 몬스터 수가 충분하다.");refresh()}
function gain(exp,gold){game.gold+=gold;game.exp+=exp;while(game.exp>=needxp()&&game.level<50){game.exp-=needxp();game.level++;game.points+=5;game.hp=maxhp();game.mp=maxmp();log("레벨 "+game.level+" 달성! 능력치 포인트 +5")}}
function open(title,content){$("modaltitle").textContent=title;$("modalbody").replaceChildren(content);$("back").classList.add("open")}function close(){if(battle)return;$("back").classList.remove("open")}
function button(text,fn){let b=document.createElement("button");b.textContent=text;b.onclick=fn;return b}
function regionMenu(){let box=document.createElement("div");box.className="choices";regions.forEach((r,i)=>box.append(button((i===game.region?"◆ ":"")+r,()=>{if(i!==game.region){game.region=i;game.player={...start};ensure(i);log(r+"에 진입했다.")}close();refresh()})));open("지역 선택 [M]",box)}
function newRun(){if(!confirm("새 탐사 회차를 시작할까요? 지도·몬스터·보물·탐사 시야가 초기화됩니다. 캐릭터 성장과 골드는 유지됩니다."))return;game.run++;game.region=0;game.player={...start};game.maps={};game.activity=0;game.day=1;ensure(0);log("제"+game.run+"회차 탐사가 시작되었다.");refresh()}
function interact(){const k=id(game.player.x,game.player.y),m=current();if(m.chests[k]){delete m.chests[k];let g=rand(35,120);gain(rand(4,12),g);log("보물상자를 열어 "+g+"G를 얻었다.")}else log("주변에 상호작용할 대상이 없다.");refresh()}
function camp(){game.day++;game.activity=0;game.hp=Math.min(maxhp(),game.hp+Math.round(maxhp()*.35));game.mp=Math.min(maxmp(),game.mp+Math.round(maxmp()*.4));respawn(false);log("야영을 마쳤다. HP와 MP가 회복되었다.");refresh()}
function statMenu(){let box=document.createElement("div");box.className="choices";Object.keys(game.stats).forEach(k=>box.append(button(k+" +1 ("+game.stats[k]+")",()=>{if(game.points<1){log("능력치 포인트가 부족하다.");return}game.stats[k]++;game.points--;game.hp=Math.min(game.hp,maxhp());game.mp=Math.min(game.mp,maxmp());$("back").classList.remove("open");refresh();statMenu()})));open("능력치 투자 · 잔여 "+game.points+"P",box)}
function beginBattle(k,kind){const [hp,atk,exp]=enemyStats[kind];battle={k,kind,hp,max:hp,atk,exp,guard:false};log(names[kind]+"와 마주쳤다!");battleMenu()}
function battleMenu(){if(!battle)return;let b=battle,box=document.createElement("div"),info=document.createElement("div");info.className="battleinfo";info.textContent=names[b.kind]+" · HP "+b.hp+" / "+b.max+" · 적 공격력 "+b.atk;box.append(info);let choices=document.createElement("div");choices.className="choices";choices.append(button("1 · 일반 공격",()=>attack(false)),button("2 · 정수 기술 (MP 8)",()=>attack(true)),button("3 · 방어",()=>enemyTurn(true)),button("4 · 도주",()=>{if(Math.random()<.72){log("전투에서 도주했다.");game.player={...start};endBattle()}else{log("도주에 실패했다.");enemyTurn(false)}}));box.append(choices);open("전투 · "+names[b.kind],box)}
function attack(skill){if(!battle)return;if(skill&&game.mp<8){log("MP가 부족하다.");return}if(skill)game.mp-=8;let dmg=Math.max(1,rand(6,11)+Math.floor(game.stats.STR*.65)+(skill?Math.floor(game.stats.MAG*.8)+9:0));battle.hp-=dmg;log(names[battle.kind]+"에게 "+dmg+"의 피해!");if(battle.hp<=0){const b=battle;delete current().monsters[b.k];let gold=rand(8,26);gain(b.exp,gold);log(names[b.kind]+" 처치! EXP +"+b.exp+" · "+gold+"G");endBattle()}else enemyTurn(false)}
function enemyTurn(guard){if(!battle)return;let dmg=Math.max(1,battle.atk-rand(0,4)-Math.floor(game.stats.HP*.12));if(guard)dmg=Math.max(1,Math.floor(dmg*.35));game.hp=Math.max(0,game.hp-dmg);log((guard?"방어 성공. ":"")+names[battle.kind]+"의 공격! HP -"+dmg);if(game.hp===0){log("쓰러졌다. 시작 지점으로 후퇴했다.");game.hp=Math.max(1,Math.floor(maxhp()*.5));game.mp=Math.max(0,Math.floor(maxmp()*.5));game.player={...start};endBattle()}else{refresh();battleMenu()}}
function endBattle(){battle=null;$("back").classList.remove("open");refresh()}
$("regions").onclick=regionMenu;$("save").onclick=()=>{save();log("탐사 기록을 저장했다.")};$("load").onclick=load;$("newrun").onclick=newRun;$("interact").onclick=interact;$("camp").onclick=camp;$("respawn").onclick=()=>respawn();$("allocate").onclick=statMenu;$("close").onclick=close;
document.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA"].includes(document.activeElement.tagName))return;const k=e.key.toLowerCase();if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();if(battle){if(k==="1")attack(false);else if(k==="2")attack(true);else if(k==="3")enemyTurn(true);else if(k==="4"){if(Math.random()<.72){log("전투에서 도주했다.");game.player={...start};endBattle()}else enemyTurn(false)}return}if(k==="escape"){close();return}if($("back").classList.contains("open"))return;if(k==="w"||k==="arrowup")step(0,-1);else if(k==="s"||k==="arrowdown")step(0,1);else if(k==="a"||k==="arrowleft")step(-1,0);else if(k==="d"||k==="arrowright")step(1,0);else if(k==="m")regionMenu();else if(k==="e")interact();else if(k==="c")camp();else if(k==="r")respawn();else if(k==="n")statMenu()});
load();
</script></body></html>
