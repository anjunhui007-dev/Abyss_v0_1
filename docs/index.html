<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>어비스 미궁 RPG · 기초 버전</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0e1420;color:#e8e4d7;font-family:system-ui,'Malgun Gothic',sans-serif;overflow:hidden}
#game{display:block;width:100vw;height:100dvh;touch-action:none}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:start;pointer-events:none;gap:12px}
.panel{background:#101b2be8;border:1px solid #65728666;border-radius:12px;padding:10px 14px;backdrop-filter:blur(8px)}
#name{font-weight:800;font-size:17px}#hint{font-size:12px;color:#bbc8d5;margin-top:4px}#message{position:fixed;left:50%;bottom:125px;transform:translateX(-50%);background:#101b2be8;border:1px solid #7b8b9c88;padding:9px 16px;border-radius:10px;text-align:center;min-width:210px;font-size:13px;pointer-events:none}
#action{position:fixed;right:24px;bottom:24px;background:#d6b97b;color:#1e2631;border:0;border-radius:16px;font-size:16px;font-weight:800;padding:18px 22px;box-shadow:0 4px 20px #0008;touch-action:manipulation}
</style></head><body>
<canvas id="game"></canvas>
<div id="hud"><div class="panel"><div id="name">마을</div><div id="hint">WASD / 방향키 이동 · E 상호작용</div></div><div class="panel" id="status">PC 전용 · 기초 버전</div></div>
<div id="message">빛나는 포탈로 다가가 보세요.</div>
<button id="action">상호작용 E</button>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),name=document.getElementById('name'),message=document.getElementById('message'),action=document.getElementById('action'),status=document.getElementById('status');
const W=960,H=640;let scene='town',pos={x:480,y:480},keys=new Set(),last=performance.now();
const portals={town:{x:480,y:160},abyss:{x:480,y:550}};
const roomTypes=['보물방','정예방','균열방','빈 방','소재방'];let roomAssignments=[];function rollRooms(){roomAssignments=Array.from({length:6},()=>{const roll=Math.random();return roll<.14?'균열방':roomTypes[Math.floor(Math.random()*4)===2?4:Math.floor(Math.random()*4)]})}rollRooms();const rooms=[{x:60,y:65,w:260,h:180},{x:350,y:60,w:260,h:180},{x:640,y:65,w:260,h:180},{x:60,y:310,w:260,h:190},{x:350,y:300,w:260,h:190},{x:640,y:310,w:260,h:190}];
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function label(t){message.textContent=t}
function near(a,b,r=78){return Math.hypot(a.x-b.x,a.y-b.y)<r}
function travel(){if(!near(pos,portals[scene])){label('포탈 가까이에서 상호작용할 수 있어요.');return}
if(scene==='town'){scene='abyss';rollRooms();pos={x:480,y:475};label('미궁 1층에 진입했습니다.')}else{scene='town';pos={x:480,y:250};label('마을로 귀환했습니다.')}
name.textContent=scene==='town'?'마을':'어비스 · 미궁 1층';status.textContent=scene==='town'?'안전 지역':'1층 · 탐험 가능'}
action.addEventListener('click',travel);addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys.add(k);if(k==='e'&&!e.repeat)travel()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());
for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k))});
function rect(x,y,w,h,fill,stroke){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.strokeRect(x,y,w,h)}}
function text(t,x,y,size=17,color='#eee'){ctx.fillStyle=color;ctx.font='600 '+size+'px system-ui';ctx.textAlign='center';ctx.fillText(t,x,y)}
function portal(x,y,color,caption,time){ctx.save();ctx.translate(x,y);ctx.shadowBlur=28;ctx.shadowColor=color;ctx.strokeStyle=color;ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(0,0,33,43,0,0,Math.PI*2);ctx.stroke();ctx.fillStyle=color+'55';ctx.beginPath();ctx.ellipse(0,0,24+Math.sin(time*2)*3,34,0,0,Math.PI*2);ctx.fill();ctx.restore();text(caption,x,y-62,17,'#f6dfac')}
function drawTown(t){rect(0,0,W,H,'#233c37');for(let x=0;x<W;x+=60)for(let y=0;y<H;y+=60){rect(x+4,y+4,52,52,(x+y)%120===0?'#29483d':'#2c4b40')}
rect(270,70,420,500,'#6b6757','#a49a7b');rect(310,100,340,430,'#837a62');rect(365,350,230,160,'#93856a');text('카르디아 · 마을 광장',480,380,23);portal(480,160,'#75d9ef','미궁 1층 입구',t);
for(const [x,y,title] of [[160,160,'상점 (예정)'],[800,160,'길드 (예정)'],[160,465,'신전 (예정)'],[800,465,'거래소 (예정)']]){rect(x-95,y-40,190,90,'#3d4b55','#788797');text(title,x,y+7,15)}
text('도박장 · 추후 추가',480,590,14,'#d0d6ca')}
function drawAbyss(t){rect(0,0,W,H,'#171e2b');for(let x=0;x<W;x+=40)for(let y=0;y<H;y+=40)rect(x+2,y+2,36,36,(x+y)%80===0?'#222c3b':'#202938');
for(const [i,r] of rooms.entries()){rect(r.x,r.y,r.w,r.h,'#343e4b','#6b7581');rect(r.x+12,r.y+12,r.w-24,r.h-24,'#3b4652');text(roomAssignments[i],r.x+r.w/2,r.y+r.h/2,19,'#e4e5e9');}
rect(280,225,400,110,'#414b57');rect(420,210,120,360,'#414b57');text('탐험 광장',480,287,22,'#e2e5e7');


portal(480,550,'#b5a1ff','마을 귀환 포탈',t)}
function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;const dx=(keys.has('d')||keys.has('arrowright')||keys.has('right')?1:0)-(keys.has('a')||keys.has('arrowleft')||keys.has('left')?1:0),dy=(keys.has('s')||keys.has('arrowdown')||keys.has('down')?1:0)-(keys.has('w')||keys.has('arrowup')||keys.has('up')?1:0);const mag=Math.hypot(dx,dy)||1;pos.x=Math.max(24,Math.min(W-24,pos.x+dx/mag*230*dt));pos.y=Math.max(24,Math.min(H-24,pos.y+dy/mag*230*dt));
const scale=Math.min(innerWidth/W,innerHeight/H),ox=(innerWidth-W*scale)/2,oy=(innerHeight-H*scale)/2;ctx.clearRect(0,0,innerWidth,innerHeight);ctx.fillStyle='#0c121c';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);if(scene==='town')drawTown(now/1000);else drawAbyss(now/1000);
ctx.shadowBlur=14;ctx.shadowColor='#ffd78b';ctx.fillStyle='#f1c776';ctx.beginPath();ctx.arc(pos.x,pos.y,14,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#2a303a';ctx.lineWidth=3;ctx.stroke();text('탐사자',pos.x,pos.y-25,13);
ctx.restore();action.style.opacity=near(pos,portals[scene])?'1':'.55';requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
