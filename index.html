'니발루프':'설산 니발루프|고산 니발루프',
'스코르바':'사막 스코르바|화산 스코르바',
'히에나르':'사막 히에나르|사바나 히에나르',
'비페라':'사막 비페라|거대 비페라',
'사우라크':'모래 사우라크|거대 사우라크',
'와이번':'산악 와이번|거대 와이번',
'우르사가':'우르사가|설곰 우르사가'
};
function essenceIdentity(x){
 const variants=essenceVariantKeys[x.name];
 if(!variants)return x.name;
 const d=x.description||'';
 const v=variants.split('|');
 if(x.name==='고블린'){if(x.floor===4)return '산악 고블린';if(x.floor===5)return '정글 고블린';return '고블린'}
 if(x.name==='실바렌')return x.floor>=11?'고대 실바렌':'실바렌';
 if(x.name==='루프란')return x.floor>=11?'거대 루프란':'루프란';
 if(x.name==='니발루프')return x.floor===10?'고산 니발루프':x.floor===7?'빙원 니발루프':'설산 니발루프';
 if(x.name==='스코르바')return x.floor===6?'화산 스코르바':'사막 스코르바';
 if(x.name==='히에나르')return x.floor===9?'사바나 히에나르':'사막 히에나르';
 if(x.name==='비페라')return x.floor===8?'거대 비페라':'사막 비페라';
 if(x.name==='사우라크')return x.floor===8?'거대 사우라크':'모래 사우라크';
 if(x.name==='와이번')return x.floor===12?'거대 와이번':'산악 와이번';
 if(x.name==='우르사가')return x.floor===7?'설곰 우르사가':'우르사가';
 const matched=v.find(z=>d.includes(z));
 if(matched)return matched;
 const fallback={트롤:{2:'숲 트롤',4:'동굴 트롤',5:'정글 트롤',6:'화산 트롤',7:'설원 트롤',10:'산악 트롤',11:'숲 트롤',12:'거대 트롤'},골렘:{3:'바위 골렘',4:'바위 골렘',6:'화산 골렘',7:'서리 골렘',9:'흙 골렘',10:'바위 골렘',12:'철갑 골렘'},오우거:{3:'사막 오우거',7:'설산 오우거',9:'사바나 오우거',10:'설산 오우거',12:'고대 오우거'}};
 return fallback[x.name]?.[x.floor]||x.name
}
const essenceUniqueMap=new Map();
for(const item of essenceRecords){
 const id=essenceIdentity(item);
 if(!essenceUniqueMap.has(id))essenceUniqueMap.set(id,{...item,id,displayName:id,floors:[item.floor]});
 else{const old=essenceUniqueMap.get(id);if(!old.floors.includes(item.floor))old.floors.push(item.floor);if(!old.stats&&item.stats){old.stats=item.stats;old.active=item.active;old.passive=item.passive}}
}
const essenceUnique=[...essenceUniqueMap.values()];
let essenceOpen=new Set(),essenceAppliedStats=new Set();
function essenceView(){
 const gradeTable='<details class="panel"><summary>층별 몬스터 등급 분포 기준</summary><div class="grid">'+gradeBands.map((g,i)=>'<div class="card">'+(i+1)+'층 · '+g+'등급</div>').join('')+'</div><p class="muted">등급은 강함을 나타내며 1등급이 최고입니다. 층별 범위는 참고용이며 예외가 있습니다.</p></details>';
 app.innerHTML=head('ESSENCE ARCHIVE','정수 도감','중복 정수는 한 번만 표시 · 화살표를 눌러 상세 정보 확인')+gradeTable+
 '<div class="toolbar"><input placeholder="몬스터 이름 검색" value="'+esc(essenceQuery)+'" oninput="essenceQuery=this.value;essenceResults()"><select onchange="essenceFloor=this.value;essenceResults()"><option value="all">전체 층</option>'+floors.map(f=>'<option value="'+f.n+'" '+(essenceFloor==f.n?'selected':'')+'>'+f.n+'층</option>').join('')+'</select><select onchange="essenceGrade=this.value;essenceResults()"><option value="all">전체 등급</option>'+Array.from({length:12},(_,i)=>'<option value="'+(i+1)+'" '+(essenceGrade==i+1?'selected':'')+'>'+(i+1)+'등급</option>').join('')+'</select></div>'+
 '<div class="essence-controls"><span id="essenceCount" class="muted"></span><button onclick="essenceOpen.clear();essenceResults()">모두 접기</button></div><div id="essenceResults" class="essence-list"></div>';
 essenceResults()
}
function essenceToggle(id){if(essenceOpen.has(id))essenceOpen.delete(id);else essenceOpen.add(id);essenceResults()}
function essenceResults(){
 const r=essenceUnique.filter(x=>(essenceFloor==='all'||x.floors.includes(Number(essenceFloor)))&&(essenceGrade==='all'||x.grade==essenceGrade)&&x.displayName.toLowerCase().includes(essenceQuery.toLowerCase()));
 document.getElementById('essenceCount').textContent=r.length+'종 / 전체 '+essenceUnique.length+'종';
 document.getElementById('essenceResults').innerHTML=r.map(x=>{
 const open=essenceOpen.has(x.id);
 return '<div class="essence-item"><button class="essence-line" aria-expanded="'+open+'" onclick="essenceToggle('+JSON.stringify(x.id).replace(/"/g,'&quot;')+')"><span class="essence-arrow">'+(open?'⌄':'›')+'</span><strong class="essence-name">'+esc(x.displayName)+'</strong><span class="essence-stats">'+(x.stats?esc(x.stats):'스탯 정보 입력 대기')+'</span></button>'+
 (open?'<div class="essence-details"><p><strong>'+x.grade+'등급</strong> · '+({normal:'일반',elite:'엘리트',named:'네임드',rift:'균열 보스',lord:'계층 군주'}[x.type])+' · 출현 '+x.floors.sort((a,b)=>a-b).map(f=>f+'층').join(', ')+'</p><p>'+esc(x.description||'')+'</p>'+(x.active?'<p><strong>액티브 · '+esc(x.active.name)+'</strong><br>'+esc(x.active.description)+'</p><p><strong>패시브 · '+esc(x.passive.name)+'</strong><br>'+esc(x.passive.description)+'</p>':'<p class="muted">정수 스탯 및 스킬 상세 데이터 입력 대기</p>')+'</div>':'')+'</div>'
 }).join('')||'<p class="muted">검색 결과가 없습니다.</p>'
}
const oldDraw=draw;draw=function(){oldDraw();if(view==='essences')essenceView()};draw();
</script></html>
